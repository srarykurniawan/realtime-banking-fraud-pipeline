[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-platform"
version = "1.0.0"
description = "Banking Fraud & Transaction Intelligence Platform - real-time fraud detection pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0,<3",       # PySpark 4.0 Arrow serializers are not pandas-3 ready
    "pyarrow>=14.0,<21",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5,<5"]
kafka = ["confluent-kafka>=2.3"]
local = ["duckdb>=1.0"]
postgres = ["psycopg2-binary>=2.9"]
snowflake = ["snowflake-connector-python[pandas]>=3.6"]
aws = ["boto3>=1.34"]
console = ["streamlit>=1.35", "duckdb>=1.0", "psycopg2-binary>=2.9"]
dev = ["pytest>=8.0", "ruff>=0.5", "duckdb>=1.0"]

[project.scripts]
fraud-simulate = "fraud_platform.simulator.generator:main"
fraud-stream = "fraud_platform.streaming.spark_job:main"
fraud-lite = "fraud_platform.lite_pipeline:main"
fraud-evaluate = "fraud_platform.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fraud_platform = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["spark: tests that start a local Spark session (slow)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["fraud_platform", "fraud_common"]
