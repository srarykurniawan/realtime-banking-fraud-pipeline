# =====================================================================
# Local end-to-end stack (mirrors the production architecture):
#   simulator -> Kafka -> Spark Structured Streaming -> PostgreSQL (Snowflake stand-in)
#   -> Investigation console (Streamlit) + Metabase (BI) ; Airflow for orchestration/monitoring
#
#   docker compose up -d --build        then open:
#     Kafka UI     http://localhost:8085
#     Console      http://localhost:8501
#     Airflow      http://localhost:8080   (login admin / admin)
#     Metabase     http://localhost:3000
# =====================================================================
name: fraud-platform

x-app-env: &app-env
  FRAUD__SOURCE__KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  FRAUD__WAREHOUSE__TYPE: postgres
  FRAUD__WAREHOUSE__POSTGRES_DSN: postgresql://fraud:fraud@postgres:5432/fraud_dw

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fraud:fraud@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"   # DAG langsung aktif
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Jakarta
    AIRFLOW__WEBSERVER__SECRET_KEY: fraud-platform-local-secret
    AIRFLOW__WEBSERVER__WORKERS: "2"                       # hemat RAM di laptop
    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "300"
    AIRFLOW__WEBSERVER__UPDATE_FAB_PERMS: "false"         # izin disinkron sekali di airflow-init (start lebih cepat)
    AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "600"  # laptop sibuk: beri gunicorn waktu 10 menit untuk siap
    AIRFLOW_CONN_FRAUD_DW: postgresql://fraud:fraud@postgres:5432/fraud_dw
    AIRFLOW_VAR_FRAUD_WAREHOUSE_CONN_ID: fraud_dw
    AIRFLOW_VAR_FRAUD_HEARTBEAT_SLA_SECONDS: "300"
    AIRFLOW_VAR_FRAUD_MAX_QUARANTINE_RATIO: "0.05"
    AIRFLOW_VAR_FRAUD_STREAM_RESTART_CMD: "echo 'restart handled by docker restart policy (production: kubectl rollout restart)'"
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:                     # tool Java ini lambat saat CPU sibuk -> beri waktu longgar
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 30s
      timeout: 60s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in txn.raw.mobile txn.raw.atm txn.raw.card txn.raw.ibanking txn.raw.partner; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 6 --replication-factor 1 --config retention.ms=604800000
        done
        for t in fraud.alerts txn.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8085:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]

  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud_dw
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud_dw"]
      interval: 5s
      retries: 20

  simulator:
    build: {context: ., dockerfile: docker/Dockerfile.app}
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment: *app-env
    command: ["fraud-simulate", "--mode", "realtime", "--sink", "kafka", "--bootstrap", "kafka:9092",
              "--rate", "60", "--labels", "/data/labels/labels.jsonl"]
    volumes: ["appdata:/data"]
    restart: unless-stopped

  spark-stream:
    build: {context: ., dockerfile: docker/Dockerfile.spark}
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    environment:
      <<: *app-env
      FRAUD__SOURCE__TYPE: kafka
      FRAUD__SOURCE__STARTING_OFFSETS: earliest
      FRAUD__STREAMING__CHECKPOINT_DIR: /data/checkpoints
      FRAUD__STREAMING__BRONZE_DIR: /data/bronze
      FRAUD__STREAMING__PUBLISH_ALERTS_TO_KAFKA: "true"
      FRAUD__STREAMING__TRIGGER_INTERVAL: "15 seconds"     # cukup real-time untuk demo, CPU jauh lebih ringan
    volumes: ["sparkdata:/data"]
    cpus: "2.0"                      # batasi CPU agar Kafka/Airflow/Postgres tetap kebagian
    restart: unless-stopped          # crash -> restart -> resume from checkpoint (no data loss)

  console:
    build: {context: ., dockerfile: docker/Dockerfile.app}
    depends_on:
      postgres: {condition: service_healthy}
    environment: *app-env
    command: ["streamlit", "run", "apps/investigation_console/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]

  # ---------------------------------------------------------------- Airflow
  # Metadata DB in the existing Postgres (database "airflow"), LocalExecutor,
  # separate webserver + scheduler. Login: admin / admin
  airflow-db:                      # one-shot: create database "airflow" if missing
    image: postgres:16
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGPASSWORD: fraud
    entrypoint: ["bash", "-c"]
    command:
      - >
        psql -h postgres -U fraud -d fraud_dw -tc "SELECT 1 FROM pg_database WHERE datname='airflow'" | grep -q 1
        || psql -h postgres -U fraud -d fraud_dw -c "CREATE DATABASE airflow"

  airflow-init:                    # one-shot: migrate metadata DB + create admin user
    <<: *airflow-common
    depends_on:
      airflow-db: {condition: service_completed_successfully}
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        airflow sync-perm &&
        (airflow users create --username admin --password admin --firstname Fraud --lastname Admin
        --role Admin --email admin@example.com || true)

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.50.20
    ports: ["3000:3000"]
    depends_on: [postgres]

volumes:
  pgdata:
  sparkdata:
  appdata:
